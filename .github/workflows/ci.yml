name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # NOTE: this repo has ~50 pre-existing lint violations (mostly `any` types and
        # a couple of real react-hooks findings) predating this CI setup -- see
        # FRONTEND_CHANGES.md. Fixing all of them is a separate, larger pass. For now
        # lint reports but doesn't block the pipeline; typecheck/test/build (the things
        # that would actually break the app) do. Remove `continue-on-error` once the
        # backlog is cleared.
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
